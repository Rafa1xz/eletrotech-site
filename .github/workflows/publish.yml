name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gerar catálogo, páginas individuais e sitemap
        run: node scripts/build-products.mjs
      - name: Validar publicação e URLs estáveis
        run: node --test qa/scripts/test-publication.mjs
      - name: Validar HTML e links locais
        shell: pwsh
        run: ./qa/scripts/static-review.ps1
      - name: Preparar arquivos públicos
        run: node scripts/prepare-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
